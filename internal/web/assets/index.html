<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应急广播脚本演练发布台</title><link rel="stylesheet" href="/assets/app.css"></head>
<body>
<header><div><span class="mark">应急信息</span><h1>广播脚本演练发布台</h1></div><div id="status" class="status">尚未载入方案</div></header>
<main>
<aside><nav><button data-tab="draft" class="active">脚本编制</button><button data-tab="baseline">基线与校验</button><button data-tab="rehearsal">计时演练</button><button data-tab="issues">整改复验</button><button data-tab="approval">独立批准</button><button data-tab="audit">发布与审计</button></nav>
<section class="worklist"><h2>方案工作清单</h2><label>方案标识<input id="filterId"></label><label>标题关键字<input id="filterKeyword"></label><label>业务状态<select id="filterState"><option value="">全部状态</option><option>草拟</option><option>待校验</option><option>待演练</option><option>整改中</option><option>待批准</option><option>已发布</option><option>已拒绝</option></select></label><button id="search">检索</button><div id="workItems"></div><div class="pager"><button id="prevPage" title="上一页">‹</button><span id="pageInfo">1 / 1</span><button id="nextPage" title="下一页">›</button></div></section></aside>
<section class="workspace">
<div class="summary"><div><small>当前方案</small><strong id="title">未创建</strong></div><div><small>状态</small><strong id="state">-</strong></div><div><small>版本</small><strong id="revision">-</strong></div><div><small>基线摘要</small><code id="baselineDigest">-</code></div></div>
<section id="draft" class="panel active"><h2>脚本编制</h2><div class="grid"><label>方案 ID<input id="packageId" value="venue-drill"></label><label>方案标题<input id="packageTitle" value="场馆疏散广播"></label><label>编写人<input id="writerId" value="editor-01"></label></div><div id="segments"></div><div class="actions"><button id="addSegment" class="secondary">添加脚本段</button><button id="create">创建方案</button><button id="saveDraft">保存草拟续编</button></div></section>
<section id="baseline" class="panel"><h2>冻结基线与规则校验</h2><div class="grid"><label>适用场景<input id="scenario" value="火警疏散"></label><label>目标听众<input id="audience" value="场馆内公众"></label><label>播出渠道<input id="channel" value="公共广播"></label><label>最大总时长（秒）<input id="maxSeconds" type="number" value="120"></label><label>必含提示语（每行一条）<textarea id="phrases">请保持冷静&#10;请从安全出口撤离</textarea></label><label>发音词表（词条=读音）<textarea id="glossary">疏散=shū sàn</textarea></label></div><div class="actions"><button id="previewBaseline" class="secondary">预检基线</button><button id="freeze" disabled>确认摘要并冻结</button><button id="validate">执行完整校验</button></div><div id="baselinePreview" class="results"></div><div class="subhead"><h3>校验批次差异</h3><select id="fromBatch"></select><select id="toBatch"></select><input id="ruleFilter" placeholder="筛选 rule_id"><button id="compare" class="secondary">比较</button></div><div id="validation" class="results"></div></section>
<section id="rehearsal" class="panel"><h2>计时演练</h2><label>演练记录人<input id="recorder" value="recorder-01"></label><div id="rehearsalRows"></div><div class="actions"><button id="rehearse">提交完整演练</button></div><div id="rehearsalStats" class="results"></div></section>
<section id="issues" class="panel"><h2>整改与定向复验</h2><div class="filters"><input id="issueAssigneeFilter" placeholder="负责人"><select id="issueStatusFilter"><option value="">全部状态</option><option>待分派</option><option>处理中</option><option>待复验</option><option>已关闭</option></select><label class="check"><input id="overdueFilter" type="checkbox">仅逾期</label><button id="filterIssues" class="secondary">筛选</button></div><div id="issueList" class="results empty">暂无问题</div><div class="grid"><label>问题 ID<input id="issueId"></label><label>原因<input id="cause"></label><label>修订说明<input id="changeSummary"></label><label>修订人<input id="revisionWriter" value="editor-01"></label></div><div class="actions"><button id="revise">提交整改说明和当前脚本</button><button id="retest" class="secondary">定向复验</button></div><h3>批量任务推进</h3><div class="grid"><label>负责人<input id="taskAssignee"></label><label>截止日期<input id="taskDue" type="date"></label><label>优先级<select id="taskPriority"><option>中</option><option>低</option><option>高</option><option>紧急</option></select></label><label>目标状态<select id="taskStatus"><option>处理中</option><option>待复验</option></select></label></div><button id="batchTasks">更新所选问题</button></section>
<section id="approval" class="panel"><h2>独立批准</h2><div class="actions"><button id="loadReview" class="secondary">载入只读审阅清单</button></div><div id="reviewList" class="results"></div><div class="grid"><label>批准人员<input id="approver" value="approver-01"></label><label>签署意见或拒绝理由<textarea id="statement">已独立核对基线、脚本、演练证据及整改结果，同意发布。</textarea></label></div><div class="actions"><button id="approve">批准并冻结</button><button id="reject" class="danger">带理由拒绝</button></div></section>
<section id="audit" class="panel"><h2>发布包与审计时间线</h2><div class="verify"><code id="bundleDigest">尚无发布包</code><button id="verify">重算并核验摘要</button><button id="downloadManifest" class="secondary">下载清单</button><label class="file-button">导入本地清单<input id="manifestFile" type="file" accept="application/json"></label></div><div id="manifestDiagnostics" class="results"></div><div id="timeline" class="timeline"></div></section>
</section></main><div id="toast" role="status"></div><script src="/assets/app.js"></script>
</body></html>
